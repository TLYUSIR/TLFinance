# Free hosting option: GitHub Pages + monthly rebuild. No AI, no server.
# 1. Push this folder to a GitHub repo. 2. Settings → Pages → Source: GitHub Actions.
name: Rebuild finance index and publish
on:
  schedule:
    - cron: "30 19 1 * *"     # 03:30 HKT on the 1st of every month
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq antiword
      - run: pip install -r requirements.txt
      - run: python build_index.py
      - name: Commit refreshed index
        run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add site/data cache/meta.json
          git diff --cached --quiet || git commit -m "Refresh finance index $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
